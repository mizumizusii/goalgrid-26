    :root {
      --ink: #f4f8f5;
      --muted: #91a29a;
      --panel: #111c18;
      --panel-2: #17251f;
      --line: rgba(255,255,255,.09);
      --lime: #c7ff4a;
      --orange: #ff7145;
      --blue: #57b9ff;
      --bg: #08110e;

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "DM Sans", sans-serif; min-height: 100vh;
      background-image: radial-gradient(circle at 88% 2%, rgba(64,126,92,.25), transparent 27%);

    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 100vh; }
    aside {

      display: flex; flex-direction: column; z-index: 5;

    .brand { display: flex; align-items: center; gap: 11px; font: 800 19px/1 "Outfit"; letter-spacing: .08em; }
    .mark { width: 33px; height: 33px; border-radius: 11px; display: grid; place-items: center; color: #08110e; background: var(--lime); transform: rotate(-5deg); }

    .nav { display: grid; gap: 6px; margin-top: 48px; }

    .nav .ico { width: 20px; text-align: center; }

    .mini-card p { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 8px 0 12px; }
    .mini-card button { width: 100%; border: 0; border-radius: 9px; padding: 9px; background: var(--lime); color: #08110e; font-weight: 800; font-size: 11px; }
    main { grid-column: 2; padding: 26px 32px 60px; max-width: 1500px; width: 100%; margin: auto; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-bottom: 25px; }
    .search { width: min(410px, 100%); position: relative; }
    .search input { width: 100%; border: 1px solid var(--line); border-radius: 13px; padding: 12px 15px 12px 41px; color: var(--ink); background: var(--panel); outline: 0; }
    .search input:focus { border-color: rgba(199,255,74,.5); }
    .search span { position: absolute; left: 15px; top: 12px; color: var(--muted); }
    .head-actions { display: flex; align-items: center; gap: 11px; }
    .lang-switch { display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:20px; background:var(--panel); }
    .lang-switch button { border:0; border-radius:16px; padding:6px 9px; color:var(--muted); background:transparent; font-size:9px; font-weight:800; }
    .lang-switch button.active { color:#08110e; background:var(--lime); }
    .icon-btn { width: 41px; height: 41px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink); background: var(--panel); }
    .icon-btn.has-games { color:#08110e; background:var(--lime); }
    .notification-panel { position:fixed; z-index:20; top:78px; right:25px; width:min(370px,calc(100% - 30px)); padding:18px; border:1px solid var(--line); border-radius:18px; background:#101c17; box-shadow:0 20px 70px #000a; transform:translateY(-12px); opacity:0; pointer-events:none; transition:.2s; }
    .notification-panel.open { transform:translateY(0); opacity:1; pointer-events:auto; }
    .notification-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:13px; }
    .notification-head h3 { margin:0; font:700 15px "Outfit"; }
    .notification-head button { border:0; color:var(--muted); background:transparent; }
    .notification-game { padding:11px 0; border-top:1px solid var(--line); }
    .notification-game b { display:block; font-size:11px; }
    .notification-game span { color:var(--muted); font-size:9px; }
    .notify-enable { width:100%; margin-top:13px; padding:10px; border:0; border-radius:10px; color:#08110e; background:var(--lime); font-size:10px; font-weight:800; }
    .avatar { width: 41px; height: 41px; border-radius: 50%; background: linear-gradient(135deg, #ffd36b, #ff774f); color: #111; display: grid; place-items: center; font-weight: 800; }
    .hero { position: relative; overflow: hidden; min-height: 225px; padding: 29px 31px; border-radius: 24px; background: linear-gradient(112deg, #193529, #10241c 58%, #1f2d25); border: 1px solid var(--line); }
    .hero:after { content:"26"; position: absolute; right: 28px; top: -56px; font: 800 260px/1 "Outfit"; color: transparent; -webkit-text-stroke: 1px rgba(199,255,74,.15); transform: rotate(-7deg); }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--lime); text-transform: uppercase; font-size: 10px; font-weight: 800; letter-spacing: .14em; }
    .pulse { width: 7px; height: 7px; background: var(--lime); border-radius: 50%; box-shadow: 0 0 0 5px rgba(199,255,74,.1); }

    .hero p { position: relative; z-index: 1; color: #abc0b5; font-size: 13px; }
    .countdown { position: absolute; z-index: 2; right: 32px; bottom: 28px; display: flex; gap: 8px; }
    .countdown div { min-width: 61px; padding: 10px 8px; text-align: center; border-radius: 13px; background: rgba(5,15,11,.63); border: 1px solid var(--line); backdrop-filter: blur(8px); }
    .countdown b { display: block; font: 700 21px "Outfit"; color: var(--lime); }
    .countdown small { font-size: 8px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }

    .section-title span, .section-title button { color: var(--muted); font-size: 11px; }

    .live-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    .live-card { border: 1px solid var(--line); border-radius: 17px; padding: 16px; background: var(--panel); transition: .2s ease; }

    .flag { font-size: 21px; width: 28px; text-align: center; }
    .score { font: 700 22px "Outfit"; letter-spacing: .08em; }

    .bar { width: 74px; height: 4px; border-radius: 10px; background: #29352f; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--lime); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(290px, .8fr); gap: 21px; }
    .filters { display: flex; gap: 7px; flex-wrap: wrap; }

    .schedule { display: grid; gap: 8px; }

    .schedule-card:hover { background: var(--panel-2); }
    .date { border-right: 1px solid var(--line); color: var(--muted); font-size: 9px; line-height: 1.6; text-transform: uppercase; letter-spacing: .08em; }
    .date b { color: var(--ink); font: 700 17px "Outfit"; }
    .fixture { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; font-size: 11px; font-weight: 700; }
    .fixture span:last-child { text-align: right; }
    .fixture em { color: var(--muted); text-align: center; font-style: normal; font-size: 9px; }
    .venue { margin-top: 6px; color: var(--muted); font-size: 8px; font-weight: 500; letter-spacing: .03em; }
    .star { border: 0; color: #6f7f77; background: transparent; font-size: 18px; }

    .side-card { padding: 17px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); margin-bottom: 13px; }

    .standing-row b:last-child { text-align: right; color: var(--lime); }
    .insight { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; margin-top: 11px; padding: 10px; border-radius: 12px; background: #192921; }

    .modal-body { padding: 25px 22px; }

    .statline { display: flex; height: 5px; overflow: hidden; border-radius: 9px; background: #25332d; }

    const games = fixtures.map((x,i)=>({id:i+1,date:x[0],day:x[1],time:"TBD",a:x[2],af:flags[x[2]]||"⚽",b:x[3],bf:flags[x[3]]||"⚽",group:x[4],venue:x[5],fav:["Japan","USA","Brazil"].includes(x[2])||["Japan","USA","Brazil"].includes(x[3]),score:"–",status:"公式日程"}));
    const standings = [{f:"🇲🇽",n:"Mexico",p:0,pts:0},{f:"🇿🇦",n:"South Africa",p:0,pts:0},{f:"🇰🇷",n:"Korea Republic",p:0,pts:0},{f:"🇨🇿",n:"Czechia",p:0,pts:0}];
    const teamJa = {"Mexico":"メキシコ","South Africa":"南アフリカ","Korea Republic":"韓国","Czechia":"チェコ","Canada":"カナダ","Bosnia and Herzegovina":"ボスニア・ヘルツェゴビナ","USA":"アメリカ","Paraguay":"パラグアイ","Haiti":"ハイチ","Scotland":"スコットランド","Australia":"オーストラリア","Türkiye":"トルコ","Brazil":"ブラジル","Morocco":"モロッコ","Qatar":"カタール","Switzerland":"スイス","Côte d'Ivoire":"コートジボワール","Ecuador":"エクアドル","Germany":"ドイツ","Curaçao":"キュラソー","Netherlands":"オランダ","Japan":"日本","Sweden":"スウェーデン","Tunisia":"チュニジア","Saudi Arabia":"サウジアラビア","Uruguay":"ウルグアイ","Spain":"スペイン","Cabo Verde":"カーボベルデ","IR Iran":"イラン","New Zealand":"ニュージーランド","Belgium":"ベルギー","Egypt":"エジプト","France":"フランス","Senegal":"セネガル","Iraq":"イラク","Norway":"ノルウェー","Argentina":"アルゼンチン","Algeria":"アルジェリア","Austria":"オーストリア","Jordan":"ヨルダン","Ghana":"ガーナ","Panama":"パナマ","England":"イングランド","Croatia":"クロアチア","Portugal":"ポルトガル","Congo DR":"コンゴ民主共和国","Uzbekistan":"ウズベキスタン","Colombia":"コロンビア"};
    const venueJa = {"Mexico City Stadium":"メキシコシティ・スタジアム","Estadio Guadalajara":"エスタディオ・グアダラハラ","Toronto Stadium":"トロント・スタジアム","Los Angeles Stadium":"ロサンゼルス・スタジアム","Boston Stadium":"ボストン・スタジアム","BC Place Vancouver":"BCプレイス・バンクーバー","New York New Jersey Stadium":"ニューヨーク・ニュージャージー・スタジアム","San Francisco Bay Area Stadium":"サンフランシスコ・ベイエリア・スタジアム","Philadelphia Stadium":"フィラデルフィア・スタジアム","Houston Stadium":"ヒューストン・スタジアム","Dallas Stadium":"ダラス・スタジアム","Estadio Monterrey":"エスタディオ・モンテレイ","Miami Stadium":"マイアミ・スタジアム","Atlanta Stadium":"アトランタ・スタジアム","Seattle Stadium":"シアトル・スタジアム","Kansas City Stadium":"カンザスシティ・スタジアム"};
    const ui = {
      en:{home:"Home",schedule:"Schedule",favorites:"Favorites",standings:"Standings",stats:"Stats",syncTitle:"Sync your watch plan",syncCopy:"Sync favorite matches across devices and get notified before kick-off.",syncBtn:"Sync for free",search:"Search teams, venues or groups",heroTitle:"39 special days.<br>One world, one game.",heroCopy:"All 104 matches, in your time zone.",featured:"Featured matches",previewNote:"Scores and stats are preview data",matchSchedule:"Match schedule",all:"All",japan:"Japan",groupA:"Group A",viewAll:"View all →",insights:"Watch insights",weekPlan:"Matches planned this week",totalTime:"270 minutes total",jstMode:"Showing in Japan time",autoConvert:"Local time converted automatically",matchCenter:"Match center",official:"Official fixture",matches:"matches",noResults:"No matches found. Check the team, venue or group name.",added:"Added to favorites",removed:"Removed from favorites",predicted:"Preview score",win:"Win probability",possession:"Possession",shots:"Shots",passes:"Pass accuracy",reminder:"Set reminder",reminderToast:"We will notify you 30 minutes before kick-off",syncToast:"Sync will be available in the next version",noAlerts:"No notifications yet",table:"Standings",days:"days",hours:"hours",mins:"mins",todayMatches:"Today's matches",enableNotifications:"Enable notifications",noneToday:"No matches scheduled today.",notificationOn:"Notifications enabled",notificationDenied:"Notifications were not allowed"},
      ja:{home:"ホーム",schedule:"試合日程",favorites:"お気に入り",standings:"順位表",stats:"スタッツ",syncTitle:"観戦プランを同期",syncCopy:"お気に入りの試合を端末間で同期し、キックオフ前に通知。",syncBtn:"無料で同期する",search:"チーム・会場・グループを検索",heroTitle:"世界がひとつになる、<br>特別な39日間。",heroCopy:"全104試合を、あなたの時間で。",featured:"注目の試合",previewNote:"スコア・スタッツはプレビュー表示",matchSchedule:"試合スケジュール",all:"すべて",japan:"日本",groupA:"グループ A",viewAll:"すべて見る →",insights:"観戦インサイト",weekPlan:"今週の観戦予定",totalTime:"合計 270分",jstMode:"日本時間で表示中",autoConvert:"現地時間との差を自動変換",matchCenter:"マッチセンター",official:"公式日程",matches:"試合",noResults:"該当する試合はありません。チーム名・会場・グループ名を確認してください。",added:"お気に入りに追加しました",removed:"お気に入りから外しました",predicted:"プレビュースコア",win:"勝利確率",possession:"ボール支配率",shots:"シュート",passes:"パス成功率",reminder:"リマインダーを設定",reminderToast:"キックオフ30分前に通知します",syncToast:"同期機能は次のバージョンで追加予定です",noAlerts:"通知はまだありません",table:"順位表",days:"日",hours:"時間",mins:"分",todayMatches:"今日の試合",enableNotifications:"通知を有効にする",noneToday:"今日予定されている試合はありません。",notificationOn:"通知を有効にしました",notificationDenied:"通知が許可されませんでした"}
    };
    let lang = localStorage.getItem("goalgrid-lang") || "en", filter = "all", query = "";
    const schedule = document.querySelector("#schedule"), toast = document.querySelector("#toast"), details = document.querySelector("#details");
    const t=k=>ui[lang][k], team=n=>lang==="ja"?(teamJa[n]||n):n, venue=n=>lang==="ja"?(venueJa[n]||n):n;
    function applyLanguage(){
      document.documentElement.lang=lang;
      document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=t(el.dataset.i18n));
      document.querySelector("#search").placeholder=t("search");
      document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
      renderFeatured();renderSchedule();renderStandings();renderTodayGames();countdown();
    }
    function renderFeatured(){
      document.querySelector("#featured").innerHTML = games.filter(g=>g.fav).slice(0,3).map((g,i)=>`<article class="live-card" onclick="openDetails(${g.id})"><div class="live-top"><span>GROUP ${g.group} · ${g.date} ${g.time}</span><span class="tag">${t("official")}</span></div><div class="team-row"><span class="team"><span class="flag">${g.af}</span>${team(g.a)}</span><b class="score">${g.score}</b></div><div class="team-row"><span class="team"><span class="flag">${g.bf}</span>${team(g.b)}</span><span></span></div><div class="match-foot"><span>${venue(g.venue)}</span><span class="bar"><i style="width:${52+i*8}%"></i></span></div></article>`).join("");
    }
    function renderSchedule(){
      const list=games.filter(g=>(filter==="all"||filter==="favorite"&&g.fav||g.group===filter||g.a.includes(filter)||g.b.includes(filter))&&(`${g.a} ${teamJa[g.a]||""} ${g.b} ${teamJa[g.b]||""} ${g.venue} ${venueJa[g.venue]||""} ${g.group} group ${g.group} グループ${g.group}`.toLowerCase().includes(query)));
      document.querySelector("#resultCount").textContent=`${list.length} / ${games.length} ${t("matches")}`;
      schedule.innerHTML=list.length?list.map(g=>`<article class="schedule-card" onclick="openDetails(${g.id})"><div class="date">${g.day}<br><b>${g.date}</b><br>${g.time}</div><div><div class="fixture"><span>${g.af} ${team(g.a)}</span><em>VS</em><span>${team(g.b)} ${g.bf}</span></div><div class="venue">GROUP ${g.group} · ${venue(g.venue)}</div></div><button class="star ${g.fav?"on":""}" onclick="toggleFav(event,${g.id})">★</button></article>`).join(""):`<div class="empty">${t("noResults")}</div>`;
    }
    function toggleFav(e,id){ e.stopPropagation(); const g=games.find(x=>x.id===id); g.fav=!g.fav; renderSchedule();renderFeatured();showToast(g.fav?t("added"):t("removed")); }
    function openDetails(id){const g=games.find(x=>x.id===id);document.querySelector("#modalBody").innerHTML=`<div class="modal-teams"><div class="modal-team"><span class="flag">${g.af}</span><b>${team(g.a)}</b></div><div><div class="modal-score">${g.score}</div><small style="color:var(--muted)">${t("predicted")}</small></div><div class="modal-team"><span class="flag">${g.bf}</span><b>${team(g.b)}</b></div></div>${stat(t("win"),54,46)}${stat(t("possession"),57,43)}${stat(t("shots"),12,9)}${stat(t("passes"),88,84)}<button onclick="showToast(t('reminderToast'))" style="margin-top:24px;width:100%;border:0;border-radius:11px;padding:12px;background:var(--lime);color:#08110e;font-weight:800">${t("reminder")}</button>`;details.showModal();}
    function stat(n,a,b){return `<div class="stat"><b>${a}</b><div><span>${n}</span><div class="statline"><i style="width:${a}%"></i></div></div><b>${b}</b></div>`}
    function showToast(t){toast.textContent=t;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)}
    document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;renderSchedule()});
    document.querySelector("#search").oninput=e=>{query=e.target.value.toLowerCase();renderSchedule()};
    document.querySelector("[data-nav=favorites]").onclick=()=>{filter="favorite";document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x.dataset.filter==="favorite"));renderSchedule();document.querySelector(".section-title:nth-of-type(2)")?.scrollIntoView({behavior:"smooth"})};
    document.querySelector("[data-nav=schedule]").onclick=()=>document.querySelector("#schedule").scrollIntoView({behavior:"smooth"});
    document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("goalgrid-lang",lang);applyLanguage()});
    document.querySelector("#syncBtn").onclick=()=>showToast(t("syncToast"));
    const notificationPanel=document.querySelector("#notificationPanel");
    function renderTodayGames(){
      const now=new Date(), date=`${now.getMonth()+1}/${now.getDate()}`, list=games.filter(g=>g.date===date);
      document.querySelector("#bell").classList.toggle("has-games",list.length>0);
      document.querySelector("#todayGames").innerHTML=list.length?list.map(g=>`<div class="notification-game"><b>${g.af} ${team(g.a)} vs ${team(g.b)} ${g.bf}</b><span>${g.time} · GROUP ${g.group} · ${venue(g.venue)}</span></div>`).join(""):`<div class="empty">${t("noneToday")}</div>`;
    }
    document.querySelector("#bell").onclick=()=>notificationPanel.classList.toggle("open");
    document.querySelector("#closeNotifications").onclick=()=>notificationPanel.classList.remove("open");
    document.querySelector("#enableNotifications").onclick=async()=>{
      if(!("Notification" in window)){showToast(t("notificationDenied"));return}
      const permission=await Notification.requestPermission();
      if(permission==="granted"){
        const registration=await navigator.serviceWorker.ready;
        const now=new Date(), date=`${now.getMonth()+1}/${now.getDate()}`, list=games.filter(g=>g.date===date);
        const body=list.length?list.map(g=>`${team(g.a)} vs ${team(g.b)}`).join(" / "):t("noneToday");
        await registration.showNotification(t("todayMatches"),{body,icon:"icon.svg",badge:"icon.svg"});
        showToast(t("notificationOn"));
      }else showToast(t("notificationDenied"));
    };
    function renderStandings(){document.querySelector("#standings").innerHTML=`<h3>${t("table")}</h3>${standings.map((x,i)=>`<div class="standing-row"><span>${i+1}</span><b>${x.f} ${team(x.n)}</b><span>${x.p}</span><b>${x.pts}</b></div>`).join("")}`}
    function countdown(){const diff=Math.max(0,new Date("2026-06-11T13:00:00-06:00")-new Date()),d=Math.floor(diff/864e5),h=Math.floor(diff/36e5)%24,m=Math.floor(diff/6e4)%60;document.querySelector("#countdown").innerHTML=[[d,t("days")],[h,t("hours")],[m,t("mins")]].map(x=>`<div><b>${String(x[0]).padStart(2,"0")}</b><small>${x[1]}</small></div>`).join("")}
    if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
    applyLanguage();setInterval(countdown,60000);
  </script>
</body>
